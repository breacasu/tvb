# TVB - Transcode Video Batch Configuration
# Encoding presets for different content types

[tvshow]
# Hardware H.265 encoding for TV shows (fast, all tracks preserved)
parameter = --add-audio all --add-subtitle all -x encoder=vt_h265 -x quality=56 -x encoder-preset=quality

[movie]
# Software H.265 encoding for movies (German/English audio)
parameter = --mode hevc --quality 24 --add-audio ger --add-audio eng --add-subtitle all

[custom]
# Software H.265 encoding, all tracks
parameter = --mode hevc --quality 24 --add-audio all --add-subtitle all

[preview]
# Preview clip length
parameter = --stop-at duration:30

[default]
# Output directory (required - adjust to your system)
outputdir = '/path/to/output/directory'

# Language & Localization
localization = 'en_US'           # Locale for CSV statistics date format

# File Handling
preserve_file_date = yes         # Preserve original file timestamps

# Dolby Atmos Support (optional)
preserve_atmos_audio = yes